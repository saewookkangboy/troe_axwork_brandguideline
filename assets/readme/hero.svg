<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">AX WORKS Brand Guideline</title>
  <desc id="desc">AX WORKS by TROE brand guideline. Only what runs, stays. Gate Line shows agent pipeline halted at a human approval diamond.</desc>

  <rect width="1200" height="380" rx="2" fill="#0C1116"/>

  <rect x="0" y="0" width="48" height="380" fill="#12181F"/>
  <text transform="translate(30 340) rotate(-90)"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="14" font-weight="500" letter-spacing="0.18em" fill="#6B7580">01 · GUIDE</text>

  <g transform="translate(80 56)">
    <text font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="14" font-weight="500" letter-spacing="0.22em" fill="#C8912B">BY TROE · ENDORSEMENT SYSTEM</text>

    <text y="62" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="56" font-weight="700" letter-spacing="-0.02em" fill="#F4F6F8">AX WORKS</text>

    <text y="100" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="22" font-weight="600" letter-spacing="0.04em" fill="#8A93A0">BRAND GUIDELINE v1.0</text>

    <text y="160" font-family="-apple-system, BlinkMacSystemFont, Apple SD Gothic Neo, Noto Sans KR, sans-serif"
          font-size="28" font-weight="700" fill="#F4F6F8">작동하는 것만 남습니다</text>
    <text y="196" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="18" font-weight="400" fill="#8A93A0">Only what runs, stays.</text>

    <text y="250" font-family="-apple-system, BlinkMacSystemFont, Apple SD Gothic Neo, Noto Sans KR, sans-serif"
          font-size="16" font-weight="400" fill="#6B7580">업무 1개를 90일 안에 가동시키고,</text>
    <text y="276" font-family="-apple-system, BlinkMacSystemFont, Apple SD Gothic Neo, Noto Sans KR, sans-serif"
          font-size="16" font-weight="400" fill="#6B7580">만들 수 있는 팀을 남기는 AX 실행 브랜드.</text>
  </g>

  <g transform="translate(640 48)">
    <rect width="504" height="284" rx="2" fill="#12181F" stroke="#1C232C" stroke-width="1"/>

    <text x="28" y="36" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="13" font-weight="500" letter-spacing="0.16em" fill="#6B7580">SIGNATURE — GATE LINE</text>

    <g transform="translate(28 110)">
      <rect x="0" y="18" width="88" height="4" fill="#1C51B9"/>
      <rect x="0" y="14" width="8" height="12" fill="#1C51B9"/>
      <text x="0" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="12" fill="#8A93A0">SIGNAL</text>

      <rect x="88" y="18" width="72" height="4" fill="#1C51B9"/>

      <g transform="translate(188 20)">
        <path d="M0,-16 L16,0 L0,16 L-16,0 Z" fill="none" stroke="#C8912B" stroke-width="3"/>
        <circle cx="0" cy="0" r="3" fill="#C8912B"/>
      </g>
      <text x="160" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="12" fill="#C8912B">GATE</text>

      <rect x="204" y="18" width="56" height="4" fill="#3A4551"/>
      <text x="268" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="12" fill="#B3261E">HALT</text>

      <path d="M188,44 L188,72 L210,72" fill="none" stroke="#B3261E" stroke-width="1.5"/>
      <rect x="210" y="58" width="196" height="36" rx="2" fill="#1C232C" stroke="#B3261E" stroke-width="1"/>
      <text x="222" y="81" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="13" fill="#B3261E">◇ EXCEPTION — 승인 대기</text>
    </g>

    <g transform="translate(28 220)">
      <rect x="0" y="8" width="20" height="4" fill="#1C51B9"/>
      <text x="28" y="14" font-family="-apple-system, BlinkMacSystemFont, Apple SD Gothic Neo, sans-serif"
            font-size="14" fill="#8A93A0">사각 선 · 에이전트</text>

      <path d="M190,10 L200,20 L190,30 L180,20 Z" fill="none" stroke="#C8912B" stroke-width="2"/>
      <text x="212" y="24" font-family="-apple-system, BlinkMacSystemFont, Apple SD Gothic Neo, sans-serif"
            font-size="14" fill="#8A93A0">마름모 · 사람 승인</text>
    </g>
  </g>

  <text x="80" y="352" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="13" letter-spacing="0.08em" fill="#4A5561">INTERACTIVE HTML · 9 CHAPTERS · 2026-08-02</text>
</svg>
